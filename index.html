<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    CAT OS — app shell.
    Rules that apply to this file (see docs/PROJECT_RULES.md):
    - No build step: plain HTML + ES modules only.
    - All URLs are RELATIVE (./...) so the app works from a GitHub Pages
      subpath (e.g. https://user.github.io/CAT-OS/) and from any static host.
    - No runtime CDN links, ever. Everything is served from this repo.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CAT OS</title>
  <meta name="description" content="CAT OS: a village that grows because you get better at CAT verbal ability and reading comprehension." />

  <!-- PWA / install -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0A1230" />
  <!-- iOS install support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CAT OS" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <link rel="icon" href="./assets/icons/icon-192.png" type="image/png" />

  <!-- Styles: tokens first (variables), then base, then components -->
  <link rel="stylesheet" href="./src/ui/styles/tokens.css" />
  <link rel="stylesheet" href="./src/ui/styles/base.css" />
  <link rel="stylesheet" href="./src/ui/styles/components.css" />
  <link rel="stylesheet" href="./src/ui/styles/game.css" />
  <link rel="stylesheet" href="./src/ui/styles/world.css" />
  <link rel="stylesheet" href="./src/ui/styles/village.css" />
</head>
<body>
  <!-- The shell: a header, a view outlet the router renders into, bottom nav. -->
  <div class="shell" id="shell">
    <header class="shell__header">
      <span class="wordmark">CAT&nbsp;OS</span>
    </header>

    <!--
      No aria-live here. It used to be aria-live="polite", which made EVERY
      DOM change inside the active screen an announcement — and a running
      <cat-timer> rewrites its text once a second, so a screen reader read the
      clock aloud on a one-second loop for the whole of a timed passage,
      talking over the passage itself. Route changes are already announced by
      the router moving focus here (core/router/router.js), and the pieces
      that genuinely need to speak carry their own regions: cat-toast's
      role="status", the result screen, the village notice.
    -->
    <main class="shell__view" id="view" tabindex="-1">
      <!-- Router renders the active screen here. -->
      <section class="screen screen--loading">
        <p class="muted">Loading…</p>
      </section>
    </main>

    <cat-nav></cat-nav>
  </div>

  <noscript>
    <div style="padding:2rem;font-family:system-ui">
      CAT OS needs JavaScript to run. Enable JavaScript and reload.
    </div>
  </noscript>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
