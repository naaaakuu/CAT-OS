<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    CAT OS — app shell.
    Rules that apply to this file (see docs/PROJECT_RULES.md):
    - No build step: plain HTML + ES modules only.
    - All URLs are RELATIVE (./...) so the app works from a GitHub Pages
      subpath (e.g. https://user.github.io/CAT-OS/) and from any static host.
    - No runtime CDN links, ever. Everything is served from this repo.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CAT OS</title>
  <meta name="description" content="CAT OS: an advanced English game. Read hard passages, untangle arguments, learn the words, and watch a little village grow as you get better. Built on the verbal section of the CAT." />

  <!-- PWA / install -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#F7F6ED" />
  <!-- iOS install support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CAT OS" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <link rel="icon" href="./assets/icons/icon-192.png" type="image/png" />

  <!--
    THE BOOT WATCHDOG. Deliberately NOT a module, and deliberately first.

    app.js installs the window `error` and `unhandledrejection` handlers — but
    app.js is the top of a graph of fifty-five modules, and if any ONE of them
    fails to load, app.js never evaluates and those handlers are never
    installed. Blocking a single module and cold-opening the village produced
    a screen that was identical at 500 ms and at thirty seconds: the shell's
    "Loading…" placeholder, no console error a learner could see, no toast, no
    way out. The error surface lived inside the thing that had failed.

    So it lives here instead, in eight lines that cannot fail to load: the
    handlers, a flag the bootstrap sets when it finishes, and a timer that
    says so if it never does.
  -->
  <script>
    window.__catos = { errors: [] };
    window.addEventListener('error', function (e) {
      // A ResizeObserver loop notification is the browser telling itself to
      // try again next frame. It is not an error the learner did anything
      // about, and it used to raise the app's "Something went wrong" toast
      // twenty-seven times in one page load.
      if (e && typeof e.message === 'string' && e.message.indexOf('ResizeObserver loop') === 0) return;
      window.__catos.errors.push(String((e && (e.message || e.error)) || e));
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.__catos.errors.push(String((e && e.reason) || e));
    });
    /* A DEADLINE IS NOT THE SAME AS A STALL.
       This used to be a flat eight seconds, which is a statement about the
       network rather than about the app: on a genuine Slow 3G first visit —
       400 kbps, 400 ms of round trip, eight hundred kilobytes still arriving
       — it fired every single time and told a learner their app had failed
       while it was loading perfectly well behind the message.

       What it should say is "nothing has arrived for a while", so the clock
       restarts every time something does. A slow connection keeps resetting
       it and is never accused of anything; a connection that has actually
       stopped reaches the same message it always did, and the learner is
       also told plainly, sooner, that a slow first visit is a slow first
       visit rather than a hang. */
    (function () {
      var QUIET = 9000;      // nothing arrived for this long = a stall
      var PATIENCE = 6000;   // still going after this long = say so
      var start = Date.now();
      var last = start;
      var said = false;
      try {
        new PerformanceObserver(function () { last = Date.now(); })
          .observe({ type: 'resource', buffered: true });
      } catch (e) { /* No PerformanceObserver: `last` never moves, so this
                       falls back to exactly the flat nine-second deadline
                       it replaced — worse on a slow network, never worse
                       than the version that shipped. */ }

      var view = function () { return document.getElementById('view'); };
      var loading = function () {
        var v = view();
        return !window.__catosBooted && v && v.querySelector('.screen--loading');
      };
      var tick = setInterval(function () {
        if (window.__catosBooted) { clearInterval(tick); return; }
        if (!loading()) return;
        var quiet = Date.now() - last;
        if (!said && quiet < QUIET && Date.now() - start > PATIENCE) {
          said = true;
          var note = document.createElement('p');
          note.className = 'hint';
          note.style.textAlign = 'center';
          note.textContent = 'Still opening. The first visit downloads the whole valley; after that it opens straight from this device.';
          var host = view().querySelector('.screen--loading') || view();
          host.appendChild(note);
        }
        if (quiet < QUIET) return;
        clearInterval(tick);
        view().innerHTML = '<section class="screen"><div class="empty">'
          + '<div class="empty__glyph" aria-hidden="true">·</div>'
          + '<h1>CAT OS did not finish opening</h1>'
          + '<p>Part of the app could not be downloaded. Everything you have done is still on this device.</p>'
          + '<p><button class="btn btn--primary" onclick="location.reload()">Try again</button></p>'
          + '</div></section>';
        console.error('[CAT OS] boot watchdog fired after ' + Math.round(quiet / 1000) + 's of silence', window.__catos.errors);
      }, 1000);
    })();
  </script>

  <!-- Styles: tokens first (variables), then base, then components -->
  <link rel="stylesheet" href="./src/ui/styles/tokens.css" />
  <link rel="stylesheet" href="./src/ui/styles/base.css" />
  <link rel="stylesheet" href="./src/ui/styles/components.css" />
  <link rel="stylesheet" href="./src/ui/styles/game.css" />
  <link rel="stylesheet" href="./src/ui/styles/world.css" />
  <link rel="stylesheet" href="./src/ui/styles/home.css" />
  <link rel="stylesheet" href="./src/ui/styles/rewards.css" />
</head>
<body>
<!-- #/rc is sixty tab stops deep before the first passage. -->
<a class="skip" href="#view">Skip to content</a>
  <!-- The shell: a header, a view outlet the router renders into, bottom nav. -->
  <div class="shell" id="shell">
    <header class="shell__header">
      <span class="wordmark">CAT&nbsp;OS</span>
    </header>

    <!--
      No aria-live here. It used to be aria-live="polite", which made EVERY
      DOM change inside the active screen an announcement — and a running
      <cat-timer> rewrites its text once a second, so a screen reader read the
      clock aloud on a one-second loop for the whole of a timed passage,
      talking over the passage itself. Route changes are already announced by
      the router moving focus here (core/router/router.js), and the pieces
      that genuinely need to speak carry their own regions: cat-toast's
      role="status", the result screen, the village notice.
    -->
    <main class="shell__view" id="view" tabindex="-1">
      <!-- Router renders the active screen here. -->
      <section class="screen screen--loading">
        <p class="muted">Loading…</p>
      </section>
    </main>

    <cat-nav></cat-nav>
  </div>

  <noscript>
    <div style="padding:2rem;font-family:system-ui">
      CAT OS needs JavaScript to run. Enable JavaScript and reload.
    </div>
  </noscript>

  <!-- If the bootstrap itself 404s, the watchdog above still fires; this
       catches the case where the browser can tell us straight away. -->
  <script type="module" src="./src/app.js" onerror="window.__catos.errors.push('app.js failed to load')"></script>
</body>
</html>
